<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>

<div class="row">
    <div class="col-sm-4 mx-auto">
        <form action="">


            <div class="mt-3 mb-3">

                <label for="email" class="form-label">email</label>
                <input type="email" name="form-control" id="email">
            </div>
            <div class="mt-3 mb-3">
                <label for="password" class="form-label">password </label>
                <input type="password" name="form-control" id="password">
            </div>
            <div class="mt-3 mb-3">
                <label for="first_name" class="form-label">first name </label>
                <input type="text" name="form-control" id="first_name">
            </div>

            <div class="mt-3 mb-3">
                <label for="edu" class="form-label">education level </label>
                <select name="edu" id="edu" class="form-select">
                    <option value="">university</option>
                    <option value="">college</option>
                    <option value="">polytechnic</option>
                    <option value="">high school</option>
                    <option value="">other</option>
                </select>
            </div>
<div class="form-check">
  <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1" checked>Option 1
  <label class="form-check-label" for="radio1"></label>
</div>
<div class="form-check">
  <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">Option 2
  <label class="form-check-label" for="radio2"></label>
</div>

        </form>
    </div>
</div>
</body>
</html>
